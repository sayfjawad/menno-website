<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>menno · chat</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #6366f1 0%, #0b1020 55%);
        color: #e7e9f3;
        padding: 1.5rem;
      }
      .card {
        width: 100%; max-width: 760px; padding: 2rem;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px; backdrop-filter: blur(8px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        display: flex; flex-direction: column; height: min(88vh, 720px);
      }
      .card header { display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; }
      .badge { display:inline-block; font-size:.8rem; padding:.2rem .6rem;
        background:#6366f1; border-radius:999px; }
      .card header h1 { margin:0; font-size: 1.4rem; }
      .card header .model { margin-left:auto; font-size:.8rem; opacity:.7; }
      #log {
        flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.6rem;
        padding:.25rem .25rem 1rem; scroll-behavior:smooth;
      }
      .bubble {
        max-width: 78%; padding:.65rem .9rem; border-radius:16px;
        font-size:.95rem; line-height:1.45; white-space:pre-wrap; word-break:break-word;
      }
      .bubble.user {
        align-self:flex-end; background: linear-gradient(180deg,#6366f1,#4f46e5);
        border-bottom-right-radius:4px;
      }
      .bubble.assistant {
        align-self:flex-start; background: rgba(0,0,0,.32);
        border:1px solid rgba(255,255,255,.14); border-bottom-left-radius:4px;
      }
      .bubble.error {
        align-self:flex-start; background: rgba(239,68,68,.18);
        border:1px solid rgba(239,68,68,.5);
      }
      form { display:flex; gap:.6rem; margin-top:.75rem; }
      input[type="text"] {
        flex:1; padding:.85rem .9rem; font-size:1rem; color:#e7e9f3;
        background: rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.18);
        border-radius:12px; outline:none;
      }
      input[type="text"]:focus { border-color:#818cf8; box-shadow:0 0 0 3px rgba(99,102,241,.25); }
      button {
        padding:.85rem 1.2rem; font-size:1rem; font-weight:600; color:#fff;
        background: linear-gradient(180deg,#6366f1,#4f46e5);
        border:none; border-radius:12px; cursor:pointer; transition:.15s;
      }
      button:hover { filter: brightness(1.08); }
      button:disabled { opacity:.6; cursor:default; }
      .muted { opacity:.55; font-size:.85rem; text-align:center; }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <span class="badge">AI Training · sdai.nl</span>
        <h1>Chat met Qwen 🤖</h1>
        <span class="model">model: qwen3.8-27b</span>
      </header>

      <div id="log" aria-live="polite"></div>

      <form id="chat-form">
        <input id="prompt" type="text" placeholder="Stel je vraag…" autocomplete="off" />
        <button type="submit" id="send-btn">Verstuur</button>
      </form>
      <p class="muted">Jouw gesprek gaat naar /api/chat — de API-key blijft veilig op de server.</p>
    </main>

    <script>
      const logEl = document.getElementById("log");
      const form = document.getElementById("chat-form");
      const promptEl = document.getElementById("prompt");
      const sendBtn = document.getElementById("send-btn");

      // Het volledige gesprek wordt elke keer meegestuurd.
      let messages = [
        {
          role: "system",
          content: "Je bent een behulpzame assistent. Antwoord kort en duidelijk in het Nederlands.",
        },
      ];

      function addBubble(text, kind) {
        const b = document.createElement("div");
        b.className = "bubble " + kind;
        b.textContent = text;
        logEl.appendChild(b);
        logEl.scrollTop = logEl.scrollHeight;
        return b;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = promptEl.value.trim();
        if (!text) return;

        addBubble(text, "user");
        promptEl.value = "";
        messages.push({ role: "user", content: text });

        const typing = addBubble("…", "assistant");
        sendBtn.disabled = true;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Er ging iets mis.");
          typing.textContent = data.reply;
          messages.push({ role: "assistant", content: data.reply });
        } catch (err) {
          typing.textContent = "⚠️ " + err.message;
          typing.className = "bubble error";
        } finally {
          sendBtn.disabled = false;
          logEl.scrollTop = logEl.scrollHeight;
        }
      });
    </script>
  </body>
</html>
